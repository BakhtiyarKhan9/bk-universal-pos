<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK UNIVERSAL POS</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#17233b}
header{background:#102c59;color:white;padding:18px;font-size:22px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin:12px 0;border-radius:12px;box-shadow:0 2px 10px #0001}
input,select,button{padding:12px;margin:6px 0;width:100%;border:1px solid #ccd4e0;border-radius:7px;font-size:15px}
button{background:#174a91;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{background:#0c3268}
button:disabled{opacity:.5;cursor:not-allowed}
button.mini{width:auto;padding:8px 12px;margin:2px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#eaf1ff;padding:18px;border-radius:10px}
.stat h2{color:#174a91;margin:8px 0}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button{width:auto;flex:1;min-width:100px}
table{width:100%;border-collapse:collapse;background:white}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.hidden{display:none}
.small{color:#65738a;font-size:13px}
.danger{background:#b52c36}
.low{color:#b52c36;font-weight:bold}
</style>
</head>

<body>
<header>BK UNIVERSAL POS</header>

<div class="container">

<!-- LOGIN -->
<section id="loginSection" class="card">
<h2>Login / Register</h2>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
<button id="loginBtn" onclick="login()">Login</button>
<button id="regBtn" onclick="register()" style="background:#EC4899">Create Account</button>
<button id="forgotBtn" onclick="forgotPassword()" style="background:#64748B">Forgot Password</button>
<p id="authMessage" class="small"></p>
</section>

<!-- APP -->
<section id="appSection" class="hidden">

<div class="card">
<div id="userInfo"></div>
<button class="danger" onclick="logout()">Logout</button>
</div>

<nav>
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('business')">Business</button>
<button onclick="showPage('products')">Products</button>
<button onclick="showPage('pos')">POS Sales</button>
</nav>

<!-- DASHBOARD -->
<div id="dashboard" class="page">
<h2>Business Dashboard</h2>
<div class="grid">
<div class="stat">Total Products<h2 id="totalProducts">0</h2></div>
<div class="stat">Total Sales<h2 id="totalSales">0</h2></div>
<div class="stat">Total Profit<h2 id="totalProfit">0</h2></div>
<div class="stat">Low Stock<h2 id="lowStock">0</h2></div>
<div class="stat">Currency<h2 id="currencyDisplay">PKR</h2></div>
</div>
<div class="card">
<h3>Recent Sales</h3>
<div id="recentSales">No sales yet.</div>
</div>
</div>

<!-- BUSINESS -->
<div id="business" class="page hidden">
<div class="card">
<h2>Business Setup</h2>
<input id="businessName" placeholder="Business Name">
<input id="ownerName" placeholder="Owner Name">
<input id="country" placeholder="Country">
<input id="city" placeholder="City">
<input id="phone" placeholder="Phone">
<select id="currency">
<option value="PKR">PKR</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
<option value="AED">AED</option>
<option value="SAR">SAR</option>
<option value="INR">INR</option>
<option value="CAD">CAD</option>
<option value="AUD">AUD</option>
<option value="JPY">JPY</option>
</select>
<button id="saveBizBtn" onclick="saveBusiness()">Save Business</button>
<p id="businessMessage" class="small"></p>
</div>
</div>

<!-- PRODUCTS -->
<div id="products" class="page hidden">
<div class="card">
<h2 id="productFormTitle">Add Product</h2>
<input id="productName" placeholder="Product Name">
<select id="unit">
<option>pcs</option><option>kg</option><option>g</option><option>litre</option>
<option>packet</option><option>box</option><option>bag</option><option>dozen</option>
</select>
<input id="sku" placeholder="SKU (optional)">
<input id="barcode" placeholder="Barcode (optional)">
<input id="cost" type="number" min="0" step="any" placeholder="Purchase Price">
<input id="price" type="number" min="0" step="any" placeholder="Sale Price">
<input id="stock" type="number" min="0" step="any" placeholder="Stock">
<input id="minStock" type="number" min="0" step="any" placeholder="Minimum Stock">
<button id="saveProdBtn" onclick="saveProduct()">Save Product</button>
<button id="cancelEdit" class="danger hidden" onclick="cancelEdit()">Cancel Edit</button>
<p id="productMessage" class="small"></p>
</div>
<div class="card">
<h2>Product Inventory</h2>
<input id="productSearch" placeholder="Search products..." oninput="renderProducts()">
<div style="overflow-x:auto">
<table>
<thead><tr><th>Product</th><th>Cost</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
<tbody id="productTable"></tbody>
</table>
</div>
</div>
</div>

<!-- POS -->
<div id="pos" class="page hidden">
<div class="card">
<h2>Point of Sale</h2>
<input id="saleSearch" placeholder="Search product name, SKU or barcode">
<button onclick="searchSaleProduct()">Find Product</button>
<div id="saleProduct" class="small"></div>
<input id="saleQuantity" type="number" min="0" step="any" value="1" placeholder="Quantity">
<select id="paymentMethod">
<option>Cash</option>
<option>Card</option>
<option>Bank Transfer</option>
<option>Digital Wallet</option>
</select>
<button id="saleBtn" onclick="completeSale()">Complete Sale</button>
<p id="saleMessage" class="small"></p>
</div>
</div>

</section>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDn1DwJZZd1QqNvXHyBQLOjyAJGRYext2Y",
  authDomain: "bk-universel-pos.firebaseapp.com",
  projectId: "bk-universel-pos",
  storageBucket: "bk-universel-pos.firebasestorage.app",
  messagingSenderId: "387558203185",
  appId: "1:387558203185:web:08bce63843120c0d1bda10"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);

let currentUser = null;
let businessId = null;
let selectedProduct = null;
let products = [];
let sales = [];
let businessCurrency = "PKR";
let editingId = null;

const ERR = {
  "auth/invalid-credential": "Email or password is wrong.",
  "auth/invalid-email": "Email is not valid.",
  "auth/missing-password": "Please enter your password.",
  "auth/email-already-in-use": "This email already has an account. Please Login.",
  "auth/weak-password": "Password must be at least 6 characters.",
  "auth/network-request-failed": "No internet connection.",
  "auth/too-many-requests": "Too many attempts. Please wait a few minutes.",
  "permission-denied": "Permission denied. Firestore rules need updating."
};
function errText(e){ return ERR[e.code] || e.message || "Something went wrong."; }
function message(id, text){ $(id).textContent = text; }
function round2(n){ return Math.round(n * 100) / 100; }
function round3(n){ return Math.round(n * 1000) / 1000; }

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function register(){
  const email = $("email").value.trim();
  const password = $("password").value;
  if(!email || password.length < 6){
    return message("authMessage","Enter a valid email and password of at least 6 characters.");
  }
  $("regBtn").disabled = true;
  try{
    const result = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection("users").doc(result.user.uid).set({
      email: email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    try{ await result.user.sendEmailVerification(); }catch(x){}
    message("authMessage","Account created. A verification email was sent.");
  }catch(e){ message("authMessage", errText(e)); }
  $("regBtn").disabled = false;
}

async function login(){
  message("authMessage","");
  $("loginBtn").disabled = true;
  try{
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
  }catch(e){ message("authMessage", errText(e)); }
  $("loginBtn").disabled = false;
}
$("password").addEventListener("keydown", e => { if(e.key === "Enter") login(); });

async function forgotPassword(){
  const email = $("email").value.trim();
  if(!email) return message("authMessage","Enter your email first.");
  try{
    await auth.sendPasswordResetEmail(email);
    message("authMessage","Reset link sent. Check your email (also Spam).");
  }catch(e){ message("authMessage", errText(e)); }
}

async function logout(){ await auth.signOut(); }

function clearUI(){
  businessId = null; products = []; sales = []; selectedProduct = null; editingId = null;
  ["businessName","ownerName","country","city","phone","saleSearch","productSearch"].forEach(id => $(id).value = "");
  $("saleProduct").textContent = "";
  ["businessMessage","productMessage","saleMessage"].forEach(id => $(id).textContent = "");
  cancelEdit();
  renderProducts();
  updateDashboard();
}

auth.onAuthStateChanged(async user => {
  currentUser = user;
  $("loginSection").classList.toggle("hidden", !!user);
  $("appSection").classList.toggle("hidden", !user);
  if(user){
    $("userInfo").textContent = "Logged in: " + user.email;
    showPage("dashboard");
    await loadBusiness();
  }else{
    clearUI();
  }
});

function showPage(page){
  document.querySelectorAll(".page").forEach(el => el.classList.add("hidden"));
  $(page).classList.remove("hidden");
}

async function saveBusiness(){
  if(!currentUser) return;
  const name = $("businessName").value.trim();
  if(!name) return message("businessMessage","Business name is required.");

  const data = {
    name,
    ownerName: $("ownerName").value.trim(),
    country: $("country").value.trim(),
    city: $("city").value.trim(),
    phone: $("phone").value.trim(),
    currency: $("currency").value,
    ownerId: currentUser.uid,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  $("saveBizBtn").disabled = true;
  try{
    if(businessId){
      await db.collection("businesses").doc(businessId).update(data);
    }else{
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      const ref = await db.collection("businesses").add(data);
      businessId = ref.id;
      await db.collection("businesses").doc(businessId)
        .collection("members").doc(currentUser.uid).set({
          role: "owner",
          status: "active"
        });
    }
    businessCurrency = data.currency;
    message("businessMessage","Business saved successfully.");
    await loadBusiness();
  }catch(e){ message("businessMessage", errText(e)); }
  $("saveBizBtn").disabled = false;
}

async function loadBusiness(){
  if(!currentUser) return;
  try{
    const snapshot = await db.collection("businesses")
      .where("ownerId","==",currentUser.uid).limit(1).get();

    if(snapshot.empty){
      businessId = null;
      showPage("business");
      message("businessMessage","Please set up your business first.");
      return;
    }
    const d = snapshot.docs[0];
    businessId = d.id;
    const b = d.data();
    businessCurrency = b.currency || "PKR";
    $("businessName").value = b.name || "";
    $("ownerName").value = b.ownerName || "";
    $("country").value = b.country || "";
    $("city").value = b.city || "";
    $("phone").value = b.phone || "";
    $("currency").value = businessCurrency;
    await loadProducts();
    await loadSales();
  }catch(e){ message("businessMessage", errText(e)); }
}

async function saveProduct(){
  if(!businessId) return message("productMessage","Create your business first.");
  const name = $("productName").value.trim();
  const costS = $("cost").value, priceS = $("price").value, stockS = $("stock").value;
  const cost = Number(costS), price = Number(priceS), stock = Number(stockS);
  const minStock = Number($("minStock").value || 0);

  if(!name || costS === "" || priceS === "" || stockS === "" ||
     !Number.isFinite(cost) || !Number.isFinite(price) || !Number.isFinite(stock) ||
     !Number.isFinite(minStock) || cost < 0 || price < 0 || stock < 0 || minStock < 0){
    return message("productMessage","Enter product name, purchase price, sale price and stock (non-negative numbers).");
  }

  const data = {
    name,
    unit: $("unit").value,
    sku: $("sku").value.trim(),
    barcode: $("barcode").value.trim(),
    cost, price, stock, minStock
  };

  $("saveProdBtn").disabled = true;
  try{
    const col = db.collection("businesses").doc(businessId).collection("products");
    if(editingId){
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      await col.doc(editingId).update(data);
      message("productMessage","Product updated.");
    }else{
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await col.add(data);
      message("productMessage","Product saved.");
    }
    cancelEdit(true);
    await loadProducts();
  }catch(e){ message("productMessage", errText(e)); }
  $("saveProdBtn").disabled = false;
}

function cancelEdit(keepMessage){
  editingId = null;
  ["productName","sku","barcode","cost","price","stock","minStock"].forEach(id => $(id).value = "");
  $("unit").value = "pcs";
  $("productFormTitle").textContent = "Add Product";
  $("saveProdBtn").textContent = "Save Product";
  $("cancelEdit").classList.add("hidden");
  if(!keepMessage) message("productMessage","");
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  $("productName").value = p.name || "";
  $("unit").value = p.unit || "pcs";
  $("sku").value = p.sku || "";
  $("barcode").value = p.barcode || "";
  $("cost").value = p.cost;
  $("price").value = p.price;
  $("stock").value = p.stock;
  $("minStock").value = p.minStock || 0;
  $("productFormTitle").textContent = "Edit Product";
  $("saveProdBtn").textContent = "Update Product";
  $("cancelEdit").classList.remove("hidden");
  message("productMessage","");
  window.scrollTo(0,0);
}

async function loadProducts(){
  if(!businessId) return;
  try{
    const snap = await db.collection("businesses").doc(businessId).collection("products").get();
    products = snap.docs.map(d => ({id:d.id, ...d.data()}));
    products.sort((a,b) => String(a.name||"").localeCompare(String(b.name||"")));
    renderProducts();
    updateDashboard();
  }catch(e){ message("productMessage", errText(e)); }
}

function renderProducts(){
  const q = ($("productSearch").value || "").toLowerCase();
  const rows = products.filter(p =>
    (p.name||"").toLowerCase().includes(q) ||
    (p.barcode||"").toLowerCase().includes(q) ||
    (p.sku||"").toLowerCase().includes(q)
  );
  $("productTable").innerHTML = rows.map(p => {
    const low = Number(p.stock||0) <= Number(p.minStock||0);
    return `<tr>
      <td>${escapeHTML(p.name)}<div class="small">${escapeHTML(p.unit||"")}</div></td>
      <td>${Number(p.cost||0).toFixed(2)}</td>
      <td>${Number(p.price||0).toFixed(2)}</td>
      <td class="${low?"low":""}">${Number(p.stock||0)}</td>
      <td>
        <button class="mini" onclick="editProduct('${p.id}')">Edit</button>
        <button class="mini danger" onclick="deleteProduct('${p.id}')">Delete</button>
      </td>
    </tr>`;
  }).join("");
}

async function deleteProduct(id){
  if(!confirm("Delete this product?")) return;
  try{
    await db.collection("businesses").doc(businessId).collection("products").doc(id).delete();
    if(editingId === id) cancelEdit();
    await loadProducts();
  }catch(e){ message("productMessage", errText(e)); }
}

function searchSaleProduct(){
  const q = $("saleSearch").value.trim().toLowerCase();
  if(!q){ selectedProduct = null; $("saleProduct").textContent = "Enter a product name, SKU or barcode."; return; }
  selectedProduct =
    products.find(p => (p.name||"").toLowerCase()===q || (p.barcode||"").toLowerCase()===q || (p.sku||"").toLowerCase()===q) ||
    products.find(p => (p.name||"").toLowerCase().includes(q));
  $("saleProduct").textContent = selectedProduct
    ? `${selectedProduct.name} | Price: ${selectedProduct.price} ${businessCurrency} per ${selectedProduct.unit||"unit"} | Stock: ${selectedProduct.stock}`
    : "Product not found.";
}

async function completeSale(){
  if(!businessId || !selectedProduct) return message("saleMessage","Select a product first.");

  const quantity = Number($("saleQuantity").value);
  const method = $("paymentMethod").value;
  if(!Number.isFinite(quantity) || quantity <= 0){
    return message("saleMessage","Enter a valid quantity greater than zero.");
  }

  const productRef = db.collection("businesses").doc(businessId).collection("products").doc(selectedProduct.id);
  const saleRef = db.collection("businesses").doc(businessId).collection("sales").doc();

  $("saleBtn").disabled = true;
  try{
    let total = 0;
    await db.runTransaction(async tx => {
      const productDoc = await tx.get(productRef);
      if(!productDoc.exists) throw new Error("Product no longer exists.");

      const p = productDoc.data();
      if(Number(p.stock) < quantity) throw new Error("Insufficient stock. Available: " + p.stock);

      total = round2(Number(p.price) * quantity);
      const costTotal = round2(Number(p.cost||0) * quantity);
      tx.update(productRef, {stock: round3(Number(p.stock) - quantity)});
      tx.set(saleRef, {
        productId: selectedProduct.id,
        productName: p.name,
        unit: p.unit || "",
        quantity,
        unitPrice: Number(p.price),
        unitCost: Number(p.cost||0),
        total,
        costTotal,
        profit: round2(total - costTotal),
        currency: businessCurrency,
        paymentMethod: method,
        cashierId: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    message("saleMessage","Sale completed: " + total.toFixed(2) + " " + businessCurrency);
    selectedProduct = null;
    $("saleProduct").textContent = "";
    $("saleSearch").value = "";
    $("saleQuantity").value = "1";
    await loadProducts();
    await loadSales();
  }catch(e){ message("saleMessage", errText(e)); }
  $("saleBtn").disabled = false;
}

async function loadSales(){
  if(!businessId) return;
  try{
    const snap = await db.collection("businesses").doc(businessId).collection("sales").get();
    sales = snap.docs.map(d => ({id:d.id, ...d.data()}));
    sales.sort((a,b) => ((b.createdAt&&b.createdAt.seconds)||0) - ((a.createdAt&&a.createdAt.seconds)||0));
    updateDashboard();
  }catch(e){ message("saleMessage", errText(e)); }
}

function updateDashboard(){
  $("totalProducts").textContent = products.length;
  $("lowStock").textContent = products.filter(p => Number(p.stock||0) <= Number(p.minStock||0)).length;
  $("totalSales").textContent = sales.reduce((s,x) => s + Number(x.total||0), 0).toFixed(2);
  $("totalProfit").textContent = sales.reduce((s,x) => s + Number(x.profit||0), 0).toFixed(2);
  $("currencyDisplay").textContent = businessCurrency;

  $("recentSales").innerHTML = sales.slice(0,5).map(s =>
    `<p>${escapeHTML(s.productName)} — ${Number(s.quantity)} × ${Number(s.unitPrice).toFixed(2)} = ${Number(s.total).toFixed(2)} ${escapeHTML(s.currency)}</p>`
  ).join("") || "No sales yet.";
}
</script>
</body>
</html>
